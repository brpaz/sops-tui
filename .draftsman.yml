# yaml-language-server: $schema=https://brpaz.github.io/draftsman/schema/config.schema.json

tag-format: "v{{version}}"

categories:
  - type: fix
    scope: security
    section: "🔐 Security updates"
  - type: chore
    scope: deps
    section: "🧩 Dependency Updates"
  - type: chore
    scope: deps-dev
    section: "🧩 Dependency Updates"
  - type: build
    scope: deps
    section: "🧩 Dependency Updates"
  - type: build
    scope: deps-dev
    section: "🧩 Dependency Updates"
  - type: feat
    section: "🚀 Features"
  - type: fix
    section: "🐛 Bug Fixes"
  - type: docs
    section: "📄 Documentation"
  - type: chore
    section: "⚠️ Maintenance"
  - type: refactor
    section: "⚠️ Maintenance"
  - type: style
    section: "⚠️ Maintenance"
  - type: test
    section: "⚠️ Maintenance"
  - type: perf
    section: "⚠️ Maintenance"
